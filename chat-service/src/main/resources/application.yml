server:
  port: 8082

spring:
  application:
    name: mini-weverse-chat
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/mini_weverse_chat
    username: mini_weverse
    password: mini_weverse
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    open-in-view: false
  sql:
    init:
      mode: always
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      database: 1
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

jwt:
  public-key-path: keys/public.pem

community-service:
  base-url: ${COMMUNITY_SERVICE_URL:http://localhost:8081}

internal:
  service-secret: ${INTERNAL_SERVICE_SECRET:mini-weverse-internal-secret}

chat:
  websocket:
    allowed-origins: http://localhost:*

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://${ZIPKIN_HOST:localhost}:9411/api/v2/spans
