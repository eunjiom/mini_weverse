# 모니터링 전용 컨테이너 묶음(Zipkin/Prometheus/Grafana). 비즈니스 로직이 없는 관찰 도구라
# MSA 서비스(docker-compose.services.yml)와는 별도 파일로 분리한다.
# 같이 띄울 때: docker compose -f docker-compose.yml -f docker-compose.services.yml -f docker-compose.monitoring.yml up -d
services:
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: mini-weverse-zipkin
    ports:
      - "9411:9411"

  prometheus:
    image: prom/prometheus:latest
    container_name: mini-weverse-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: mini-weverse-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  grafana-data:
