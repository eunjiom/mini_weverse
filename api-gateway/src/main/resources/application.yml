server:
  port: 8080

spring:
  application:
    name: mini-weverse-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: chat-service-ws
              uri: ${CHAT_SERVICE_WS_URL:ws://localhost:8082}
              predicates:
                - Path=/api/chat/ws-chat
            - id: chat-service
              uri: ${CHAT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/chat/**
            - id: community-service
              uri: ${COMMUNITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/**

jwt:
  public-key-path: keys/public.pem
