server:
  port: 8080

spring:
  application:
    name: mini-weverse-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: chat-service-ws
              uri: ws://localhost:8082
              predicates:
                - Path=/api/chat/ws-chat
            - id: chat-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/chat/**
            - id: community-service
              uri: http://localhost:8081
              predicates:
                - Path=/**

jwt:
  public-key-path: keys/public.pem
