services:
  postgres:
    image: postgres:16-alpine
    container_name: mini-weverse-postgres
    environment:
      POSTGRES_DB: mini_weverse
      POSTGRES_USER: mini_weverse
      POSTGRES_PASSWORD: mini_weverse
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini_weverse -d mini_weverse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mini-weverse-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
