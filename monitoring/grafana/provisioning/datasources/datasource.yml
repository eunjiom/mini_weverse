apiVersion: 1

datasources:
  # Prometheus의 exemplar 연동이 이 datasource의 uid를 참조하므로, 반드시 Prometheus보다 먼저 선언해야
  # 프로비저닝 시점에 "data source not found" 에러 없이 uid를 찾을 수 있다.
  - name: Zipkin
    type: zipkin
    access: proxy
    url: http://zipkin:9411
    uid: zipkin

  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    uid: prometheus
    # 그래프의 특정 지점(exemplar)을 클릭하면 그 순간의 trace_id로 Zipkin 트레이스를 바로 연다.
    jsonData:
      exemplarTraceIdDestinations:
        - datasourceUid: zipkin
          name: trace_id
