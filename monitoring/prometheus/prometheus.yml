global:
  scrape_interval: 15s

scrape_configs:
  - job_name: community-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['community-service:8081']

  - job_name: chat-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['chat-service:8082']

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['notification-service:8083']

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api-gateway:8080']
