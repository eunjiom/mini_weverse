  <text x="24" y="52" font-size="12" fill="#52514e">VU 10, 동일 유저·아티스트 동시 갱신 (k6-concurrent-renewal.js) — 세 방식 모두 500 에러 0건·DB 유실 없음</text>

  <!-- legend -->
  <rect x="478" y="63" width="10" height="10" rx="2" fill="#cfe0e8"/>
