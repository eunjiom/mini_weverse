  <rect x="536" y="63" width="10" height="10" rx="2" fill="#7fabc9"/>
  <text x="550" y="72" font-size="11" fill="#52514e">p95</text>
  <rect x="588" y="63" width="10" height="10" rx="2" fill="#2f5c80"/>
  <text x="602" y="72" font-size="11" fill="#52514e">max</text>

  <!-- baseline -->
  <line x1="60" y1="390" x2="660" y2="390" stroke="#c3c2b7" stroke-width="1"/>

  <!-- winner highlight backing -->
