  <rect x="343" y="155" width="34" height="235" rx="4" fill="#7fabc9"/>
  <text x="360" y="149" font-size="10" fill="#898781" text-anchor="middle">199</text>

  <rect x="381" y="144" width="34" height="246" rx="4" fill="#2f5c80"/>
  <text x="398" y="138" font-size="10" fill="#898781" text-anchor="middle">208</text>

  <text x="360" y="408" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">낙관적 락</text>
  <text x="360" y="422" font-size="11" fill="#898781" text-anchor="middle">+재시도</text>

  <!-- Group 3: Redis 분산락 -->
  <rect x="465" y="218" width="34" height="172" rx="4" fill="#cfe0e8"/>
