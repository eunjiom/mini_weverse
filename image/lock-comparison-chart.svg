<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="720" height="460" fill="#fcfcfb"/>
  <text x="24" y="32" font-size="16" font-weight="600" fill="#0b0b0b">동시 멤버십 취소 — 락 방식별 응답시간 비교 (ms)</text>
  <text x="24" y="52" font-size="12" fill="#52514e">VU 100, 동일 row 동시 취소 (k6-concurrent-cancel.js) — 세 방식 모두 성공 1건·500 에러 0건, 3회 평균</text>

  <!-- legend -->
  <rect x="536" y="63" width="10" height="10" rx="2" fill="#cfe0e8"/>
  <text x="550" y="72" font-size="11" fill="#52514e">평균</text>
  <rect x="600" y="63" width="10" height="10" rx="2" fill="#2f5c80"/>
  <text x="614" y="72" font-size="11" fill="#52514e">p95</text>

  <!-- baseline -->
  <line x1="60" y1="390" x2="660" y2="390" stroke="#c3c2b7" stroke-width="1"/>

  <!-- winner highlight backing (선정 근거: 속도 우위가 아니라 구현 단순함·인프라 불필요) -->
  <rect x="135" y="92" width="128" height="298" rx="10" fill="#eaf3ee"/>
  <text x="199" y="86" font-size="12" font-weight="600" fill="#1f6f4a" text-anchor="middle">✓ 채택 · 단순함·추가 인프라 불필요</text>

  <!-- Group 1: 비관적 락 (현재) — 평균 580 / p95 931, scale 1000ms -> 300px -->
  <rect x="153" y="216" width="44" height="174" rx="4" fill="#cfe0e8"/>
  <text x="175" y="210" font-size="10" fill="#52514e" text-anchor="middle">580</text>

  <rect x="203" y="111" width="44" height="279" rx="4" fill="#2f5c80"/>
  <text x="225" y="105" font-size="10" fill="#52514e" text-anchor="middle">931</text>

  <text x="200" y="408" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">비관적 락</text>
  <text x="200" y="422" font-size="11" fill="#898781" text-anchor="middle">(현재 코드)</text>

  <!-- Group 2: 낙관적 락+재시도 — 평균 781 / p95 880 -->
  <rect x="313" y="156" width="44" height="234" rx="4" fill="#cfe0e8"/>
  <text x="335" y="150" font-size="10" fill="#898781" text-anchor="middle">781</text>

  <rect x="363" y="126" width="44" height="264" rx="4" fill="#2f5c80"/>
  <text x="385" y="120" font-size="10" fill="#898781" text-anchor="middle">880</text>

  <text x="360" y="408" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">낙관적 락</text>
  <text x="360" y="422" font-size="11" fill="#898781" text-anchor="middle">+재시도</text>

  <!-- Group 3: Redis 분산락 — 평균 585 / p95 698 -->
  <rect x="473" y="214" width="44" height="176" rx="4" fill="#cfe0e8"/>
  <text x="495" y="208" font-size="10" fill="#898781" text-anchor="middle">585</text>

  <rect x="523" y="181" width="44" height="209" rx="4" fill="#2f5c80"/>
  <text x="545" y="175" font-size="10" fill="#898781" text-anchor="middle">698</text>

  <text x="520" y="408" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">Redis</text>
  <text x="520" y="422" font-size="11" fill="#898781" text-anchor="middle">분산락</text>

  <text x="24" y="446" font-size="11" fill="#898781">로컬 Docker 환경 측정 — 세 방식 모두 정합성(중복 취소 0건) 동일, 속도는 뚜렷한 우위 없음</text>
</svg>
