# 앱 서비스 4개(community-service, chat-service, notification-service, api-gateway) 전용 compose 파일.
# DB/인프라(postgres, redis, kafka)는 docker-compose.yml에 그대로 두고 분리 관리한다.
# 같이 띄울 때: docker compose -f docker-compose.yml -f docker-compose.services.yml up -d
services:
  community-service:
    build:
      context: ./community-service
    container_name: mini-weverse-community
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      CHAT_SERVICE_URL: http://chat-service:8082
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      ZIPKIN_HOST: zipkin
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.3"
    ports:
      - "9091:8081"
    volumes:
      - ./community-service/keys:/app/keys:ro
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  chat-service:
    build:
      context: ./chat-service
    container_name: mini-weverse-chat
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      COMMUNITY_SERVICE_URL: http://community-service:8081
      ZIPKIN_HOST: zipkin
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.3"
    ports:
      - "9094:8082"
    volumes:
      - ./chat-service/keys:/app/keys:ro
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    build:
      context: ./notification-service
    container_name: mini-weverse-notification
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ZIPKIN_HOST: zipkin
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.3"
    ports:
      - "9093:8083"
    volumes:
      - ./notification-service/keys:/app/keys:ro
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  api-gateway:
    build:
      context: ./api-gateway
    container_name: mini-weverse-gateway
    environment:
      CHAT_SERVICE_WS_URL: ws://chat-service:8082
      CHAT_SERVICE_URL: http://chat-service:8082
      COMMUNITY_SERVICE_URL: http://community-service:8081
      NOTIFICATION_SERVICE_URL: http://notification-service:8083
      ZIPKIN_HOST: zipkin
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.3"
    ports:
      - "9090:8080"
    volumes:
      - ./api-gateway/keys:/app/keys:ro
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      community-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
