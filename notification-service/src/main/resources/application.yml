server:
  port: 8083

spring:
  application:
    name: mini-weverse-notification
  # notification-service는 Redis+Kafka만 쓰고 DB가 없다. 그런데 common 모듈의
  # NotificationOutboxEvent(JPA @Entity)가 컴포넌트 스캔 베이스 패키지(com.miniweverse)
  # 하위라 이 서비스에도 자동으로 스캔돼, DataSource가 없는데 JPA 자동 설정이 시도되며
  # 기동이 실패했다. 이 서비스에서는 JPA/DataSource 자동 설정 자체를 꺼서 막는다
  # (NotificationOutboxEvent는 발행 측인 community-service/chat-service에서만 쓰는 엔티티).
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceInitializationAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      database: 2
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.miniweverse.common.notification
        spring.json.value.default.type: com.miniweverse.common.notification.NotificationEvent
        spring.json.use.type.headers: false
    listener:
      observation-enabled: true

jwt:
  public-key-path: keys/public.pem

notification:
  redis:
    ttl-days: 7

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://${ZIPKIN_HOST:localhost}:9411/api/v2/spans
