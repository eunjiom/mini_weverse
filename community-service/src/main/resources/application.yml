server:
  port: 8081

spring:
  application:
    name: mini-weverse
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/mini_weverse
    username: mini_weverse
    password: mini_weverse
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    open-in-view: false
    properties:
      jakarta:
        persistence:
          lock:
            timeout: 3000
  sql:
    init:
      mode: always
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      database: 0
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            client-authentication-method: client_secret_post
            scope: profile_nickname, account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  private-key-path: keys/private.pem
  public-key-path: keys/public.pem
  access-token-validity: 1800000
  refresh-token-validity: 604800000

cookie:
  secure: true

chat-service:
  base-url: ${CHAT_SERVICE_URL:http://localhost:8082}

internal:
  service-secret: ${INTERNAL_SERVICE_SECRET:mini-weverse-internal-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://${ZIPKIN_HOST:localhost}:9411/api/v2/spans
