server:
  port: 8081

spring:
  application:
    name: mini-weverse
  datasource:
    url: jdbc:postgresql://localhost:5432/mini_weverse
    username: mini_weverse
    password: mini_weverse
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    open-in-view: false
    properties:
      jakarta:
        persistence:
          lock:
            timeout: 3000
  sql:
    init:
      mode: always
  data:
    redis:
      host: localhost
      port: 6380

jwt:
  private-key-path: keys/private.pem
  public-key-path: keys/public.pem
  access-token-validity: 1800000
  refresh-token-validity: 1209600000

cookie:
  secure: true

chat-service:
  base-url: http://localhost:8082

internal:
  service-secret: ${INTERNAL_SERVICE_SECRET:mini-weverse-internal-secret}
