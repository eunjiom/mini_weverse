# 이 워크플로우는 현재 Docker 이미지 빌드까지만 실행합니다.
# 실제 배포 시 아래 ECR push / ECS 배포 단계의 주석을 해제하고
# AWS 크리덴셜(AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY 등 secrets)과
# ECR 리포지토리 4개(community/chat/notification/gateway) · ECS Fargate
# 클러스터(mini-weverse-cluster) · 서비스 4개 · 태스크 정의 4개를 먼저
# 준비해야 합니다. 전환 시점 기준은 README 4장 참고(AWS 전환 + 아웃박스
# 발행자 스케일아웃).
name: CD

on:
  push:
    branches:
      - dev

jobs:
  build-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build jars
        run: ./gradlew :community-service:bootJar :chat-service:bootJar :notification-service:bootJar :api-gateway:bootJar

      - name: Build Docker images
        run: |
          docker build -t mini-weverse-community:${{ github.sha }} ./community-service
          docker build -t mini-weverse-chat:${{ github.sha }} ./chat-service
          docker build -t mini-weverse-notification:${{ github.sha }} ./notification-service
          docker build -t mini-weverse-gateway:${{ github.sha }} ./api-gateway

