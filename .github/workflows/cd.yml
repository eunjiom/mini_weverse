# 이 워크플로우는 현재 Docker 이미지 빌드까지만 실행합니다.
# 실제 배포 시 아래 ECR push / ECS 배포 단계의 주석을 해제하고
# AWS 크리덴셜(AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY 등 secrets)과
# ECR 리포지토리 / ECS 클러스터·서비스 설정을 먼저 준비해야 합니다.
name: CD

on:
  push:
    branches:
      - dev

jobs:
  build-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build jar
        run: ./gradlew :auth-user-service:bootJar

      - name: Build Docker image
        run: docker build -t mini-weverse:${{ github.sha }} .

